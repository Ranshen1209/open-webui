# Sakrylle Web - Nginx reverse proxy
# Deploy to /opt/stack/nginx/conf.d/sakrylle-web.conf
# SSL uses wildcard cert for *.sakrylle.com mounted in the nginx container.

server {
    listen 8443 ssl;
    server_name chat.sakrylle.com;

    ssl_certificate /etc/letsencrypt/live/sakrylle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakrylle.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://sakrylle-web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (required for open-webui streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running SSE connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffering settings for streaming
        proxy_buffering off;
        proxy_cache off;
    }
}
